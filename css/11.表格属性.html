<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leo</title>
    <style>
        table,td{
            /* solid:代表实线 */
            border: 3px solid green;
        }
        table{
            /* 折叠边框 */
            border-collapse: collapse;
        }
        td{
            text-align: center;
            /* 上对齐:top,中对齐:center,下对齐:bottom */
            vertical-align: center;
            /* 表格填充:内容与边框之间的距离 */
            padding: 20px;
            background-color: #555555;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
    </table>
</body>
</html>
