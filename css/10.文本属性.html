<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leo</title>
    <style>
        h3{
            text-align: center;
            /* 添加下划线:underline,上划线：overline,删除线:line-through */
            text-decoration: underline;
        }
        .p1{
            font-size: 30px;
            text-align: center;
            /* 首字母大写:captialize,全部大写:uppercase,全部小写:lowercase */
            text-transform: capitalize;
        }
        .p2{
            /* 首行缩进：30px是两个字符的距离 */
            text-indent: 30px;
        }
    </style>
</head>
<body>
    <h3>我居中啦</h3>
    <p class="p1">helloworld</p>
    <p class="p2">北京时间7月3日，世界杯淘汰赛继续展开，西班牙3-0完胜奥地利，成功晋级16强。本场比赛西班牙完全占据场上主动，奥地利全场没有一次射门打正，而西班牙的奥亚萨瓦尔梅开二度，波罗也踢进一球。
        西班牙在小组赛首场比赛就被佛得角逼平，一时间外界对他们也是不太看好，可随后他们慢慢进入节奏，第二场直接4-0大胜沙特，最后一轮1-0击败乌拉圭，直接送对手直接出局。
        最终西班牙以2胜1平的成绩拿到小组第一，淘汰赛首战对阵奥地利，而这一次他们延续火热的状态，没有给奥地利任何机会。</p>
</body>
</html>
