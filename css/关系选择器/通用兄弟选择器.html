<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leo</title>
    <style>
        h1~p{
            color: red;
        }
    </style>
</head>
<body>
    <p>我在上面我不生效</p>
    <h1>我是标题</h1>
    <p>我在h1后面，我生效</p>
    <p>在h1后面的p都生效</p>
</body>
</html>
