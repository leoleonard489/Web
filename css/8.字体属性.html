<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leo</title>
    <style>
        p{
            color: #ff0000;
        }
        h2{
            color: #00ff00;
        }
        h3{
            color: #0000ff;
        }
        h4{
            color: rgba(0,0,0,0.5);
            font-size: 100px;
        }
    </style>
</head>
<body>
    <h4>rgba的a代表透明度</h4>
    <p style="font-weight: bold;font-size: 50px;">我变粗了</p>
    <p style="font-weight: bolder;font-size: 50px;">我更粗了</p>
    <p style="font-weight: lighter;font-size: 50px;">我变细了</p>
    <p style="font-weight: 400;font-size: 50px;font-style: italic;">400为正常粗细，我还变斜了</p>
    <i style="font-style: normal;font-size: 50px;">我本来是斜体，我变直了</i>
    <p style="font-family: “SimHei”;font-size: 50px;">我的字体种类变了</p>
</body>
</html>
