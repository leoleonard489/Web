<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 500px;
            background-color: #555555;
            overflow: hidden;
            /* overflow:清楚浮动 */
            clear: both;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            margin: 5px;
            float: left;
            /* 浮动会造成父级高度塌陷 */
        }
        .text{
            width: 100px;
            height: 100px;
            background-color: green;
            margin: 5px;
            clear: both;
            /* 清除浮动 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="text"></div>
    </div>
</body>
</html>
