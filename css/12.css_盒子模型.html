<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leo</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: #555555;
            /* 内边距的大小 */
            padding: 50px 10px;
                /* padding可以分为四个方向(padding-left,right,top,bottom) */
            /* 边框线的设置 */
            border: 5px solid red;
            /* solid：实线 */
            /* 外边距的大小 */
            margin: 50px;
                /* margin也可以分为四个方向(margin-left,right,top,bottom) */
        }
    </style>
</head>
<body>
    <div>我是内容</div>
    <p>我里容器的距离就远了</p>
</body>
</html>
