<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: red;
            box-shadow: 10px 10px 5px rgba(0,0,0,0.3);
            /* 0.3为透明度，0为完全透明，1为完全不透明 */
            /* 10px为水平偏移量，10px为垂直偏移量 */
            /* 5px为模糊半径 */
            margin: 250px auto;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
