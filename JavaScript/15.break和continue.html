<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // while循环
        // while(条件){
        //     循环体
        // }
        var i = 0;
        while (i <= 10) {
            if (i === 5) {
                i++
                continue; // 当i等于5时，跳过本次循环
            }
            if (i === 8) {
                break; // 当i等于8时，跳出循环
            }
            console.log(i);
            i++;
        }
    </script>
</body>
</html>
