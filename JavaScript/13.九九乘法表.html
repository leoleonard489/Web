<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (var i = 1; i <= 9; i++) {
            for (var j = 1; j <= i; j++) {
                document.write(j + "×" + i + "=" + (i * j) + "&nbsp;&nbsp;");
                // &nbsp; 表示一个空格，但它有特殊性质：
                // 1. 它不会被浏览器折行
                // 2. 它不会被浏览器忽略
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
