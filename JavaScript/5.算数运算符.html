<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 100;
        var b = 10;

        console.log(a + b); // 110  
        console.log(a - b); // 90
        console.log(a * b); // 1000
        console.log(a / b); // 10
        console.log(a % b); // 0

        // 先自相加再打印
        console.log(++a); // 101
        console.log(--b); // 9

        // 先打印再自相加
        console.log(a++); // 101， a = 102
        console.log(b--); // 9， b = 8

    </script>
</body>
</html>
