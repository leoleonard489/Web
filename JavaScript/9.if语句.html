<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 1;
        if(!a) {
            console.log("I am true");
        } else {
            console.log("I am false");
        }

        // 判断今天星期几
        var day = 3;
        if(day == 1) {
            console.log("今天是星期一");
        } else if(day == 2) {
            console.log("今天是星期二");
        } else if(day == 3) {
            console.log("今天是星期三");
        } else if(day == 4) {
            console.log("今天是星期四");
        } else if(day == 5) {
            console.log("今天是星期五");
        } else if(day == 6) {
            console.log("今天是星期六");
        } else if(day == 7) {
            console.log("今天是星期日");
        } else {
            console.log("输入错误");
        }

        // 今天吃什么
        var eat = 1;
        var food = "面条";
        if (eat) {
            if (food == "面条") {
                console.log("今天吃面条");
            } else {
                console.log("今天吃其他的");
            }
        } else {
            console.log("今天不吃东西");
        }
    </script>
</body>
</html>
