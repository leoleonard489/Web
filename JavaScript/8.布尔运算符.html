<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = true;
        console.log(!a); // false

        console.log(!null); // true
        console.log(!undefined); // true
        console.log(!0); // true
        console.log(!""); // true
        console.log(!false); // true

        // 且
        console.log(10<20 && 20<30); // true
        // 或
        console.log(10<20 || 20>30); // true
    </script>
</body>
</html>
